%YAML:1.0
File.version: "1.0"

Camera.type: "PinHole"

# Left image ROI (crop out warped edges)
Camera1.ROI: !!opencv-matrix
   rows: 1
   cols: 4
   dt: i
   data: [40, 20, 768, 440]  # [x, y, width, height]

# Right image ROI
Camera2.ROI: !!opencv-matrix
   rows: 1
   cols: 4
   dt: i
   data: [40, 20, 768, 440]

Camera1.fx: 422.639
Camera1.fy: 424.172
Camera1.cx: 426.330
Camera1.cy: 240.828

# Distortion is ZERO because Pinax already fixed it
Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0

# Right Camera (Virtual)
Camera2.fx: 424.102
Camera2.fy: 425.608
Camera2.cx: 427.677
Camera2.cy: 240.242

Camera2.k1: 0.0
Camera2.k2: 0.0
Camera2.p1: 0.0
Camera2.p2: 0.0

# Image resolution
Camera.width: 848
Camera.height: 480

# Camera frames per second 
Camera.fps: 30

Camera.RGB: 2

Stereo.ThDepth: 40.0

Stereo.bf: 40.987654

Stereo.ThDepth: 40.0

Stereo.bf: 41.03932204

Stereo.T_c1_c2: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.99999892, -0.00027171, 0.00127117, 0.09668478,
          0.00027413, 0.99999742, -0.00190264, -0.00004838,
          -0.00127065, 0.00190299, 0.99999738, -0.00024446,
          0.0, 0.0, 0.0, 1.0]

# High sensitivity thresholds for feature extraction
ORBextractor.nFeatures: 2500
ORBextractor.scaleFactor: 1.15
ORBextractor.nLevels: 9
ORBextractor.iniThFAST: 8
ORBextractor.minThFAST: 4

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0

Camera1.maskPath: "../mask/infra1_mask.png"
Camera2.maskPath: "../mask/infra1_mask.png"
