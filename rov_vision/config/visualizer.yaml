visualizer:
  ros__parameters:
    topics:
      color: /camera/color/image_raw
      infra1: /camera/infra1/image_rect_raw # left
      infra2: /camera/infra2/image_rect_raw # right
      output: /visualizer/image # only if stream.publish_ros_image
      depth: /visualizer/depth # 32FC1 metres, only if stream.publish_depth
    qos:
      reliable: false # false = best effort
      depth: 2

    camera: # left / infra1
      width: 848
      height: 480
      fx: 430.793086
      fy: 430.793086
      cx: 414.830803
      cy: 244.104872
      k1: 0.0
      k2: 0.0
      p1: 0.0
      p2: 0.0
      baseline: 0.09638894907585159 # metres (Tlr x-translation)
      bf: 41.523693 # fx*baseline, only used if baseline <= 0
    camera2: # right / infra2
      fx: 430.793086
      fy: 430.793086
      cx: 414.830803
      cy: 244.104872
      k1: 0.0
      k2: 0.0
      p1: 0.0
      p2: 0.0

    stereo:
      processing_scale: 0.5 # downscale before matching (1.0 = full res, slowest)
      num_disparities: 208 # multiple of 16. Min depth ~= fx*scale*baseline / this
      min_disparity: 0
      block_size: 7 # odd
      mode: sgbm # sgbm | sgbm_3way | hh | hh4
      p1_scale: 8
      p2_scale: 32
      uniqueness_ratio: 10
      speckle_window_size: 100
      speckle_range: 2
      disp12_max_diff: 1
      pre_filter_cap: 31
      median_ksize: 3 # 0 (off), 3 or 5, applied to the depth map
      sync_slop_sec: 0.02 # max stamp difference between infra1 and infra2
      pad_left: true
      crop_blank_strip: false # alternative to pad_left: crop the strip and zoom (accurate, narrower view)

    depth:
      min_m: 0.10 # red  (near)
      max_m: 3.0 # blue (far)
      colormap: jet # jet | turbo
    legend:
      enabled: true
      ticks: 6
      width: 84

    stream:
      mode: color # color | depth | alternate
      alternate_color_sec: 3.0
      alternate_depth_sec: 1.0
      event_driven: true # true: send a frame whenever a new image arrives; false: fixed rate
      fps: 15.0 # fixed-rate period when event_driven is false; also the encoder's nominal fps
      output_width: 848
      output_height: 480
      stale_timeout_sec: 1.0 # show "NO SIGNAL" if a source is older than this
      overlay_mode_text: true
      publish_ros_image: true
      publish_depth: true

    gcs:
      enabled: true
      ip: 127.0.0.1
      port: 5600
      encoder: x264 # x264 | nvenc | jetson | custom
      bitrate_kbps: 2000
      pipeline: "" # used when encoder: custom
